# Public T1: CPU smoke test of the real model code path (random weights, synthetic input).
# Builds mmcv-full 1.7.2 CPU ops and fetches BEVDet at the pinned commit (docker/build_cpu_stack.sh),
# so it is slow; it runs on demand, weekly and on pushes to main, not on every pull request.
# GitHub-hosted runner only; no secrets; read-only token (review correction 6).
name: smoke-cpu

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["src/**", "configs/**", "docker/**", "tests/smoke/**", "pyproject.toml"]

permissions:
  contents: read

jobs:
  t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build CPU model stack (pinned sources)
        run: PYTHON=python MAX_JOBS=4 bash docker/build_cpu_stack.sh
      - name: Smoke test (CPU only)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q tests/smoke
