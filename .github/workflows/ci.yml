# Public CI (T0). Synthetic data only, CPU only, GitHub-hosted runners only.
# Review correction 6: no self-hosted runner, no pull_request_target, no secrets, read-only token.
# Restricted GPU tests (T2) never run here; they run from a trusted local checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Restricted-artifact guard
        run: python tools/check_restricted.py
      - name: Lint
        run: ruff check src tests tools
      - name: Format
        run: ruff format --check src tests tools
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest -q
